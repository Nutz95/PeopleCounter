<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}
      .hdr{font:700 14px Arial,sans-serif;fill:#0f172a}
      .txt{font:500 12px Arial,sans-serif;fill:#334155}
      .lane{stroke:#94a3b8;stroke-width:1.2}
      .evt{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.5}
      .sync{fill:#fee2e2;stroke:#ef4444;stroke-width:1.5}
      .ok{fill:#dcfce7;stroke:#22c55e;stroke-width:1.5}
      .arr{stroke:#0f172a;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .ret{stroke:#0f172a;stroke-width:1.3;fill:none;stroke-dasharray:6 5;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#0f172a"/>
    </marker>
  </defs>

  <text x="28" y="42" class="title">Chronologie sync — frame, hotspots et encode</text>

  <text x="120" y="86" class="hdr">Decode thread</text>
  <text x="470" y="86" class="hdr">Main loop</text>
  <text x="820" y="86" class="hdr">Publisher</text>
  <text x="1170" y="86" class="hdr">NVJPEG worker</text>

  <line x1="160" y1="96" x2="160" y2="680" class="lane"/>
  <line x1="510" y1="96" x2="510" y2="680" class="lane"/>
  <line x1="860" y1="96" x2="860" y2="680" class="lane"/>
  <line x1="1210" y1="96" x2="1210" y2="680" class="lane"/>

  <rect x="65" y="125" width="190" height="36" rx="8" class="evt"/>
  <text x="78" y="148" class="txt">Decode NVDEC frame k</text>

  <rect x="65" y="178" width="190" height="36" rx="8" class="evt"/>
  <text x="78" y="201" class="txt">Copy to stable slot</text>

  <path d="M160 235 L505 235" class="arr"/>
  <text x="280" y="227" class="txt">next_frame(frame_id=f)</text>

  <rect x="410" y="250" width="200" height="36" rx="8" class="evt"/>
  <text x="422" y="273" class="txt">preprocess + inference</text>

  <path d="M510 305 L1205 305" class="arr"/>
  <text x="770" y="297" class="txt">submit encode(frame=f)</text>

  <rect x="1110" y="320" width="200" height="36" rx="8" class="sync"/>
  <text x="1122" y="343" class="txt">enc_event.synchronize()</text>

  <path d="M510 372 L855 372" class="arr"/>
  <text x="655" y="364" class="txt">publish(frame=f, hotspots)</text>

  <rect x="760" y="388" width="200" height="36" rx="8" class="ok"/>
  <text x="772" y="411" class="txt">cache hotspots by frame_id</text>

  <path d="M1210 446 L865 446" class="arr"/>
  <text x="950" y="438" class="txt">lookup hotspots for frame f</text>

  <path d="M860 482 L1205 482" class="ret"/>
  <text x="962" y="474" class="txt">exact / fallback / miss</text>

  <rect x="1110" y="500" width="200" height="36" rx="8" class="evt"/>
  <text x="1122" y="523" class="txt">GPU hotspots draw</text>

  <rect x="1110" y="548" width="200" height="36" rx="8" class="sync"/>
  <text x="1122" y="571" class="txt">NVJPEG encode + sync</text>

  <path d="M1210 604 L515 604" class="ret"/>
  <text x="855" y="596" class="txt">done callback -> submit stashed frame</text>

  <text x="28" y="705" class="txt">Red boxes = synchronization points most likely to amplify latency bursts when timing drifts.</text>
</svg>